version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: org.jetbrains.compose.material3:material3
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
